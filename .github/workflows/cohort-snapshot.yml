name: Cohort Snapshot

# cohort-fade 本番検証の"種"。Hyperdash公開コホートL/Sを毎時記録して時系列を貯める。
# 数週間〜数ヶ月後に検出力のあるバックテストを可能にする(HL fillsは約2週間しか遡れない)。

on:
  workflow_dispatch:
  schedule:
    - cron: "5 * * * *"  # 毎時5分(毎正時の混雑を避ける)

permissions:
  contents: write  # 収集した時系列をリポジトリに追記コミットするため

concurrency:
  group: cohort-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    name: Record cohort L/S snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: projects/coin-scout

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: projects/coin-scout/research/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r research/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Take snapshot
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python research/cohort_snapshot.py --out data/cohorts.jsonl

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cohorts.jsonl
          if git diff --cached --quiet; then
            echo "変更なし(取得失敗の可能性)。コミットせず終了。"
          else
            git commit -m "chore(cohort-snapshot): $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
