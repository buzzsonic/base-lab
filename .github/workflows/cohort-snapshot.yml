name: Cohort Snapshot

# cohort-fade 本番検証の"種"。Hyperdash公開コホートL/Sを毎時記録して時系列を貯める。
# 数週間〜数ヶ月後に検出力のあるバックテストを可能にする(HL fillsは約2週間しか遡れない)。
#
# データは main ではなく data ブランチへ積む(1日120コミットでmainの履歴が埋まるため)。
# 「復元 → 実行 → 書き戻し」の順序を崩すと、追記先が空ファイルになり過去データが消える。

on:
  workflow_dispatch:
  schedule:
    # 10分毎に試行し、--once-per-hour で1時間に1レコードだけ残す。
    # 毎時5分の設定だった頃、全runがsuccessなのに時単位カバー率は52%しかなかった
    # (中央値1.57時間間隔・最大8.8時間の欠測)。GitHub Actions の schedule は
    # 繁忙時にスキップ・遅延するため、頻度を上げた冗長化でしか埋められない。
    # publicリポジトリなのでActionsの実行時間は無料。
    - cron: "*/10 * * * *"

permissions:
  contents: write  # 収集した時系列を data ブランチに追記コミットするため

concurrency:
  group: cohort-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    name: Record cohort L/S snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: projects/coin-scout

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Checkout data branch
        uses: actions/checkout@v6
        with:
          ref: data
          path: _databranch

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: projects/coin-scout/research/requirements.txt

      # 追記先を前回の状態に戻す。これを飛ばすと毎回1行だけの新規ファイルになる。
      # 10分毎に走るので、重い処理より先に「この時は記録済みか」を判定する。
      - name: Restore previous data
        run: |
          mkdir -p data
          cp -a "${GITHUB_WORKSPACE}/_databranch/coin-scout/data/." data/ 2>/dev/null || true
          echo "復元後の行数: $(wc -l < data/cohorts.jsonl 2>/dev/null || echo 0)"

      # cohort_snapshot のトップレベルimportは標準ライブラリのみ(requests/playwrightは遅延import)。
      # よって依存インストール前でも判定関数を呼べる = スキップ時はブラウザを落とさずに済む。
      - name: Skip if this hour is already recorded
        id: gate
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import sys
          from datetime import datetime, timezone
          from pathlib import Path
          sys.path.insert(0, "research")
          from cohort_snapshot import last_recorded_hour
          current = datetime.now(timezone.utc).replace(minute=0, second=0, microsecond=0)
          recorded = last_recorded_hour(Path("data/cohorts.jsonl"))
          skip = recorded is not None and recorded >= current
          print(f"skip={'true' if skip else 'false'}")
          print(f"記録済み時: {recorded} / 現在時: {current} → skip={skip}", file=sys.stderr)
          PY

      - name: Cache Playwright browsers
        if: steps.gate.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r research/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Take snapshot
        if: steps.gate.outputs.skip != 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python research/cohort_snapshot.py --out data/cohorts.jsonl --once-per-hour

      - name: Commit snapshot to data branch
        if: steps.gate.outputs.skip != 'true'
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/_databranch/coin-scout/data"
          cp -a data/. "${GITHUB_WORKSPACE}/_databranch/coin-scout/data/"
          cd "${GITHUB_WORKSPACE}/_databranch"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "変更なし(取得失敗の可能性)。コミットせず終了。"
            exit 0
          fi
          git commit -m "cohort-snapshot: $(date -u +%Y-%m-%dT%H:%MZ)"
          # spread-logger も同じ data ブランチへ書くので、衝突をリトライで吸収する
          for i in 1 2 3; do
            if git pull --rebase origin data && git push origin HEAD:data; then
              echo "push成功 (試行 $i)"
              exit 0
            fi
            sleep $(( RANDOM % 10 + 5 ))
          done
          echo "3回試行しても push できませんでした" >&2
          exit 1
