name: Hyperliquid Leaderboard Alert

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

jobs:
  run-alert:
    name: Run Hyperliquid leaderboard alert
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: projects/hyperliquid-leaderboard-alert

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: projects/hyperliquid-leaderboard-alert/requirements.txt

      - name: Restore previous snapshot
        uses: actions/cache/restore@v4
        with:
          path: projects/hyperliquid-leaderboard-alert/.state
          key: hyperliquid-leaderboard-alert-state-${{ github.run_id }}
          restore-keys: |
            hyperliquid-leaderboard-alert-state-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run alert batch
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ALERT_MODE: leaderboard
          LEADERBOARD_LIMIT: "100"
          TARGET_SIDE: both
          MIN_ABS_POSITION_USD: "10000"
          MIN_POSITION_CHANGE_USD: "500000"
          DRY_RUN: "false"
        run: python -m src.main

      - name: Save current snapshot
        if: success()
        uses: actions/cache/save@v4
        with:
          path: projects/hyperliquid-leaderboard-alert/.state
          key: hyperliquid-leaderboard-alert-state-${{ github.run_id }}
