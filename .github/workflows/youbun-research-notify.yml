name: Youbun Research Completion Notification

on:
  workflow_dispatch:
    inputs:
      status:
        description: Completion status
        required: true
        type: choice
        options: [success, warning, failure]
      work:
        description: Work summary
        required: true
        type: string
      tests:
        description: Test result
        required: true
        type: string
      github:
        description: Branch and commit
        required: true
        type: string
      next_task:
        description: Next task
        required: true
        type: string
      note:
        description: Optional note
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Send Discord completion notification
        env:
          YOUBUN_DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL_YOUBUNKUN }}
        run: |
          python3 projects/hyperliquid-youbun-research/scripts/notify_discord.py \
            --status "${{ inputs.status }}" \
            --work "${{ inputs.work }}" \
            --tests "${{ inputs.tests }}" \
            --github "${{ inputs.github }}" \
            --next "${{ inputs.next_task }}" \
            --note "${{ inputs.note }}"
