name: Yobun Hoihoi Weekly Update

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Do not send Discord"
        required: false
        default: true
        type: boolean
  schedule:
    # Monday 00:00 JST
    - cron: "0 15 * * 0"

permissions:
  contents: write

concurrency:
  # This workflow only reads cohort snapshots and writes a dated report. Keep it
  # out of the shared data-writer queue so a newer pending collector cannot
  # cancel the weekly report; push_data_branch.sh handles rebase/retry.
  group: youbun-hoihoi-weekly
  cancel-in-progress: false

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: projects/hyperliquid-youbun-hoihoi
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          ref: data
          path: persisted
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: projects/hyperliquid-youbun-hoihoi/requirements.txt
      - run: pip install -r requirements.txt
      - name: Unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Build read-only cohort comparison
        env:
          PYTHONPATH: src
        run: |
          current="$GITHUB_WORKSPACE/persisted/projects/hyperliquid-youbun-hoihoi/outputs/current"
          shadow="$GITHUB_WORKSPACE/persisted/projects/hyperliquid-youbun-hoihoi/outputs/cohorts/stratified-20261003"
          report_date="$(TZ=Asia/Tokyo date +%Y-%m-%d)"
          report="$GITHUB_WORKSPACE/persisted/projects/hyperliquid-youbun-hoihoi/outputs/reports/weekly/$report_date/cohort_comparison.json"
          test -f "$current/wallet_registry.parquet"
          test -f "$shadow/wallet_registry.parquet"
          python -m hoihoi.quality_gate --current "$current" --shadow "$shadow" --output "$report"
      - name: Upload comparison artifact
        uses: actions/upload-artifact@v6
        with:
          name: youbun-hoihoi-weekly-${{ github.run_id }}-${{ github.run_attempt }}
          path: persisted/projects/hyperliquid-youbun-hoihoi/outputs/reports/weekly/
          if-no-files-found: error
          retention-days: 30
      - name: Persist report only
        if: github.event_name == 'schedule' || inputs.dry_run == false
        working-directory: persisted
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/hyperliquid-youbun-hoihoi/outputs/reports/weekly
          if ! git diff --cached --quiet; then
            git commit -m 'data: add Hoihoi weekly cohort comparison'
            bash "$GITHUB_WORKSPACE/projects/hyperliquid-youbun-hoihoi/scripts/push_data_branch.sh" data 3
          fi
