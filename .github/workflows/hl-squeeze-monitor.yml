name: HL Squeeze Monitor
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths:
      - "projects/hl-squeeze-monitor/**"
      - ".github/workflows/hl-squeeze-monitor.yml"
permissions:
  contents: read
concurrency:
  group: hl-squeeze-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: projects/hl-squeeze-monitor
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: projects/hl-squeeze-monitor/requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: projects/hl-squeeze-monitor/.state
          key: hl-squeeze-state-${{ github.run_id }}
          restore-keys: hl-squeeze-state-
      - run: python -m pip install -r requirements.txt
      - run: PYTHONPATH=${{ github.workspace }} python -m src.main
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DEBUG: "false"
          MIN_24H_VOLUME_USD: "1000000"
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: projects/hl-squeeze-monitor/.state
          key: hl-squeeze-state-${{ github.run_id }}
