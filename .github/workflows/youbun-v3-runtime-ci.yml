name: Youbun Forward v3 Runtime CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/youbun-v3-runtime-ci.yml"
      - "projects/hyperliquid-youbun-research/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Unit and runtime contract tests
        run: |
          bash -n projects/hyperliquid-youbun-research/deploy/vps/run_collector.sh
          bash -n projects/hyperliquid-youbun-research/deploy/vps/health.sh
          PYTHONPATH=projects/hyperliquid-youbun-research \
          python -m unittest discover -s projects/hyperliquid-youbun-research/tests -v
      - name: Build VPS image
        run: docker build -f projects/hyperliquid-youbun-research/deploy/vps/Dockerfile -t youbun-forward-v3:test .
