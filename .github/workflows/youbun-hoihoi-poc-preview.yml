name: Yobun Hoihoi Stratified PoC Preview

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Yobun Hoihoi Public Trades Discovery']
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  preview:
    # The scheduled 00:05 JST discovery on Oct 3 is the fourth time band.
    # Manual dispatch remains available; later scheduled discoveries skip this job.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'schedule' &&
       github.event.workflow_run.conclusion == 'success' &&
       (startsWith(github.event.workflow_run.created_at, '2026-10-02T15:') ||
        startsWith(github.event.workflow_run.created_at, '2026-10-02T16:')))
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          ref: data
          path: persisted
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: projects/hyperliquid-youbun-hoihoi/requirements.txt
      - run: pip install -r projects/hyperliquid-youbun-hoihoi/requirements.txt
      - name: Verify and evaluate a fresh 200 to 100 cohort
        env:
          PYTHONPATH: projects/hyperliquid-youbun-hoihoi/src
        run: |
          python -m unittest discover -s projects/hyperliquid-youbun-hoihoi/tests -v
          preview="$RUNNER_TEMP/hoihoi-poc-preview"
          mkdir -p "$preview"
          cp -a persisted/projects/hyperliquid-youbun-hoihoi/outputs/current/discovery "$preview/"
          python -m hoihoi.pipeline poc --output "$preview" --limit 100 --refresh
          mkdir -p preview-result
          cp "$preview/poc_manifest.json" "$preview/discovery_pool.parquet" \
             "$preview/wallet_registry.parquet" "$preview/arbitrage_wallets.csv" \
             "$preview/ARBITRAGE_WALLETS.md" preview-result/
      - name: Upload compact PoC comparison
        uses: actions/upload-artifact@v6
        with:
          name: youbun-hoihoi-poc-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: preview-result/
          if-no-files-found: error
          retention-days: 30
