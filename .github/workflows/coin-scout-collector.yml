name: Coin Scout Observation Collector

# 既存の朝8時/夜20時ダイジェストとは分離した5分観測。
# GitHub Actionsの予定時刻ではなく、collectorが取得した実測時刻を保存する。
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: coin-scout-observation-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: projects/coin-scout
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
      - name: Checkout persistent data branch
        uses: actions/checkout@v6
        with:
          ref: data
          path: _databranch
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: projects/coin-scout/requirements.txt
      - name: Restore observations and collector state
        run: |
          mkdir -p data/observations .state
          cp -a "${GITHUB_WORKSPACE}/_databranch/coin-scout/data/observations/." data/observations/ 2>/dev/null || true
          cp -a "${GITHUB_WORKSPACE}/_databranch/coin-scout/.state/." .state/ 2>/dev/null || true
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Collect all watched markets
        env:
          PYTHONPATH: ${{ github.workspace }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DRY_RUN: "false"
          STATE_ALERTS_ENABLED: "true"
          LOGIC_VERSION: "observability-v2.0"
        run: python -m src.collector
      - name: Persist immutable logs and state to data branch
        if: always()
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/_databranch/coin-scout/data/observations" "${GITHUB_WORKSPACE}/_databranch/coin-scout/.state"
          cp -a data/observations/. "${GITHUB_WORKSPACE}/_databranch/coin-scout/data/observations/" 2>/dev/null || true
          cp -a .state/. "${GITHUB_WORKSPACE}/_databranch/coin-scout/.state/" 2>/dev/null || true
          cd "${GITHUB_WORKSPACE}/_databranch"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add coin-scout/data/observations coin-scout/.state
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "coin-scout-observation: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          for i in 1 2 3; do
            if git pull --rebase origin data && git push origin HEAD:data; then exit 0; fi
            sleep $(( RANDOM % 10 + 5 ))
          done
          exit 1
