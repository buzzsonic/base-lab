name: Yobun Hoihoi Sunday Snapshot

on:
  workflow_dispatch:
  schedule:
    # Sunday 00:00 JST
    - cron: "0 15 * * 6"

permissions:
  contents: read

concurrency:
  group: youbun-hoihoi-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: projects/hyperliquid-youbun-hoihoi
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: projects/hyperliquid-youbun-hoihoi/requirements.txt
      - run: pip install -r requirements.txt
      - name: Validate snapshot implementation gate
        run: |
          echo "Snapshot workflow skeleton only: production data-branch persistence is intentionally gated after the 200-wallet PoC."
          test -f PROJECT_CONTEXT.md
          test -f config.json
