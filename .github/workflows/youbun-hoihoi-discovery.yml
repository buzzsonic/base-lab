name: Yobun Hoihoi Public Trades Discovery

on:
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: Collection duration for this window
        required: false
        default: "300"
  schedule:
    # JST 00:05 / 06:05 / 12:05 / 18:05. Minutes are offset from busy top-of-hour slots.
    - cron: "5 15,21,3,9 * * *"

permissions:
  contents: read

concurrency:
  group: youbun-hoihoi-public-trades-discovery
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: projects/hyperliquid-youbun-hoihoi
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: projects/hyperliquid-youbun-hoihoi/requirements.txt
      - run: pip install -r requirements.txt
      - name: Collect read-only public Trades
        env:
          INPUT_DURATION: ${{ inputs.duration_seconds }}
        run: |
          duration="${INPUT_DURATION:-300}"
          PYTHONPATH=src python -m hoihoi.collector --duration "$duration" --refresh
      - name: Upload partitioned raw data and coverage manifest
        uses: actions/upload-artifact@v6
        with:
          name: youbun-hoihoi-discovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: projects/hyperliquid-youbun-hoihoi/outputs/discovery/
          if-no-files-found: error
          retention-days: 30
